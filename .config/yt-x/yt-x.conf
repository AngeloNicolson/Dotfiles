# yt-x — YouTube in the terminal (search, browse with thumbnails, play in mpv).
# Based on Hyprlust's config (github.com/NischalDawadi/Hyprlust); adapted:
# chafa thumbnails (foot shows images via sixel; Hyprlust's icat is kitty-only),
# nvim, and this machine's Videos folder. Open with Right-Alt + V.
AUTO_LOADED_EXTENSIONS: 
PRETTY_PRINT: true
EDITOR: nvim
PREFERRED_SELECTOR: fzf
VIDEO_QUALITY: 1080
ENABLE_PREVIEW: true
IMAGE_RENDERER: chafa
DISOWN_STREAMING_PROCESS: true
UPDATE_RECENT: true
SEARCH_HISTORY: true
NO_OF_RECENT: 30
PLAYER: mpv
PREFERRED_BROWSER: firefox
NO_OF_SEARCH_RESULTS: 30
NOTIFICATION_DURATION: 5
DOWNLOAD_DIRECTORY: /home/Angel/Videos/yt-x
UPDATE_CHECK: false
