# Lock screen — modelled on 43PR's "That one desktop setup" (youtu.be/kYZ5mkGuQEg):
# blurred live desktop, big clock + date up top, wide pill password field,
# keyboard layout under it, now-playing + transport glyphs near the bottom.
# Opened by the power menu (SUPER+grave → L) and hypr/scripts/lock.sh.
# Positions are offsets from screen centre in logical px.

general {
  hide_cursor = false
  grace = 0
}

# Blurred snapshot of the desktop as it was when locking
background {
  monitor =
  path = screenshot
  color = rgba(20, 24, 28, 1)

  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 0.9
  brightness = 0.6
  vibrancy = 0.1
}

# Time
label {
  monitor =
  text = $TIME
  color = rgba(255, 255, 255, 0.92)
  font_size = 96
  font_family = Adwaita Sans
  shadow_passes = 1
  shadow_size = 4

  position = 0, 400
  halign = center
  valign = center
}

# Date — "Sunday, 09 August 2026"
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B %Y"
  color = rgba(255, 255, 255, 0.85)
  font_size = 20
  font_family = Adwaita Sans
  shadow_passes = 1

  position = 0, 315
  halign = center
  valign = center
}

# Password field — wide, translucent, thin white outline
input-field {
  monitor =
  size = 410, 60
  rounding = 14

  outline_thickness = 2
  outer_color = rgba(255, 255, 255, 0.75)
  inner_color = rgba(20, 24, 28, 0.35)
  font_color = rgba(255, 255, 255, 0.9)
  check_color = rgba(255, 255, 255, 0.95)
  fail_color = rgba(251, 73, 52, 0.9)
  capslock_color = rgba(250, 189, 47, 0.9)

  fade_on_empty = false
  placeholder_text =
  fail_text = <i>$FAIL</i>
  dots_size = 0.22
  dots_spacing = 0.35
  dots_center = true

  position = 0, 0
  halign = center
  valign = center
}

# Keyboard layout ("en")
label {
  monitor =
  text = $LAYOUT[en]
  color = rgba(255, 255, 255, 0.8)
  font_size = 15
  font_family = Adwaita Sans

  position = 0, -70
  halign = center
  valign = center
}

# Now playing — hidden when nothing is playing
label {
  monitor =
  text = cmd[update:1000] playerctl metadata --format '♪  {{ title }} - {{ artist }}' 2>/dev/null | cut -c1-60
  color = rgba(255, 255, 255, 0.85)
  font_size = 16
  font_family = Adwaita Sans
  shadow_passes = 1

  position = 0, -345
  halign = center
  valign = center
}

# Transport glyphs (display only — hyprlock has no clickable widgets)
label {
  monitor =
  text = cmd[update:1000] s=$(playerctl status 2>/dev/null) || exit 0; [ "$s" = Playing ] && p='󰏤' || p='󰐊'; printf '󰅁      %s      󰅂' "$p"
  color = rgba(255, 255, 255, 0.85)
  font_size = 22
  font_family = Iosevka Nerd Font Mono

  position = 0, -420
  halign = center
  valign = center
}
