# ── Dialogs / child windows: float, center, raise on top ────────────────
# Hyprland has no generic "is-a-dialog" matcher (Wayland toplevels don't
# advertise a dialog type), so we float by portal class + common dialog
# titles. Floating windows always render above tiled ones, and
# focus_on_activate = true raises them to the front when they map.
windowrule = float on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|zenity|org\.freedesktop\.impl\.portal\.desktop\.(gtk|kde))$
windowrule = float on, match:title ^(Open|Open File|Open Files|Open Folder|Save|Save As|Save File|Save Image|Select|Select Folder|Select File|Choose|Choose File|Choose Files|Export|Import|Print|Preferences|Settings|Properties|About|Authentication|Sign in|Log in|Login|Add|Rename|Find|Replace|Confirm|Warning|Error|Bookmark).*

# Pin dialogs so they render ABOVE special-workspace overlays. Plain
# floating renders under a special overlay if the dialog lands on the
# normal workspace beneath it; pinning is the only thing that always
# wins z-order over a special workspace. (pin implies/requires float.)
windowrule = pin on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|zenity|org\.freedesktop\.impl\.portal\.desktop\.(gtk|kde))$
windowrule = pin on, match:title ^(Open|Open File|Open Files|Open Folder|Save|Save As|Save File|Save Image|Select|Select Folder|Select File|Choose|Choose File|Choose Files|Export|Import|Print|Preferences|Settings|Properties|About|Authentication|Sign in|Log in|Login|Add|Rename|Find|Replace|Confirm|Warning|Error|Bookmark).*

# Center the obvious file/dialog choosers when they float
windowrule = center 1, match:class ^(xdg-desktop-portal-gtk|zenity)$
windowrule = center 1, match:title ^(Open|Save|Select|Choose|Export|Import|Print).*

# Foot terminal - semi-transparent
windowrule = opacity 0.75 override 0.75 override, match:class ^foot$

# Swappy (screenshot editor) - float and center
windowrule = float on, match:class ^swappy$
windowrule = size 80% 80%, match:class ^swappy$
windowrule = center 1, match:class ^swappy$

# ╻ ╻┏━┓┏━┓╻┏ ┏━┓┏━┓┏━┓┏━╸┏━╸   ┏━┓╻ ╻╻  ┏━╸┏━┓
# ┃╻┃┃ ┃┣┳┛┣┻┓┗━┓┣━┛┣━┫┃  ┣╸    ┣┳┛┃ ┃┃  ┣╸ ┗━┓
# ┗┻┛┗━┛╹┗╸╹ ╹┗━┛╹  ╹ ╹┗━╸┗━╸   ╹┗╸┗━┛┗━╸┗━╸┗━┛

workspace=special,gapsin:24,gapsout:64
workspace=special:browser,monitor:DP-2,gapsin:24,gapsout:64
workspace=special:document,monitor:DP-2,gapsin:24,gapsout:64
workspace=special:media,gapsin:24,gapsout:64
workspace=special:kondor,gapsin:24,gapsout:64

# Route apps to special workspaces
windowrule = workspace special:browser silent, match:class firefox
windowrule = workspace special:document silent, match:class org.pwmt.zathura
windowrule = workspace special:media silent, match:class mpv
windowrule = workspace special:kondor silent, match:class blender
windowrule = tile on, match:class blender

# ╻  ┏━┓╻ ╻┏━╸┏━┓   ┏━┓╻ ╻╻  ┏━╸┏━┓
# ┃  ┣━┫┗┳┛┣╸ ┣┳┛   ┣┳┛┃ ┃┃  ┣╸ ┗━┓
# ┗━╸╹ ╹ ╹ ┗━╸╹┗╸   ╹┗╸┗━┛┗━╸┗━╸┗━┛

layerrule = blur on, match:namespace logout
layerrule = no_anim on, match:namespace bar
layerrule = no_anim on, match:namespace notifications
layerrule = no_anim on, match:namespace audio_controls
layerrule = no_anim on, match:namespace system_controls
layerrule = no_anim on, match:namespace calendar
