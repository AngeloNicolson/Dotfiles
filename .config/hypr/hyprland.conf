# ┏┳┓┏━┓┏┓╻╻╺┳╸┏━┓┏━┓
# ┃┃┃┃ ┃┃┗┫┃ ┃ ┃ ┃┣┳┛
# ╹ ╹┗━┛╹ ╹╹ ╹ ┗━┛╹┗╸

# Universal fallback: any monitor on any machine lights up at its preferred
# mode, auto-positioned, scale 1. Machine-specific monitor declarations (exact
# names, resolutions, scales, positions, workspace bindings) live in the
# gitignored custom/general.conf and custom/rules.conf — sourced below, so they
# override this fallback. See custom/general.conf.example to set up a new machine.
monitor = ,preferred,auto,1

# Handle lid switch
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid-switch.sh open

# ╻  ┏━┓╻ ╻┏┓╻┏━╸╻ ╻
# ┃  ┣━┫┃ ┃┃┗┫┃  ┣━┫
# ┗━╸╹ ╹┗━┛╹ ╹┗━╸╹ ╹

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1

exec-once = ags run ~/.config/ags/app.tsx

exec-once = ~/.config/hypr/scripts/controls.sh
exec-once = ~/.config/hypr/scripts/resetxdgportal.sh
exec-once = ~/.config/hypr/scripts/batterynotify.sh
exec-once = ~/.config/hypr/scripts/wallpaperdaemon.sh
exec-once = ~/.config/hypr/scripts/load_default_environment.sh
# Auto-detects the backlight device instead of assuming intel_backlight
exec-once = ~/.config/hypr/scripts/init-backlight.sh 20

# Idle daemon: dim at 2.5 min, panel off at 5 min (OLED care) — see hypridle.conf
exec-once = hypridle

# ┏━╸┏┓╻╻ ╻
# ┣╸ ┃┗┫┃┏┛
# ┗━╸╹ ╹┗┛

env = GTK_THEME,adw-gtk3-dark
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = HYPRLAND_NO_SD_NOTIFY,0
env = GI_TYPELIB_PATH,/usr/local/lib/girepository-1.0:/usr/lib/girepository-1.0

# GPU-specific env (NVIDIA backend, hardware cursors, AQ_DRM_DEVICES, etc.) is
# machine-specific and lives in the gitignored custom/env.conf — sourced below.
# See custom/env.conf.example for NVIDIA / Intel / AMD templates.

# ╻┏┓╻┏━┓╻ ╻╺┳╸
# ┃┃┗┫┣━┛┃ ┃ ┃
# ╹╹ ╹╹  ┗━┛ ╹

input {
    kb_layout = us
    kb_options = caps:escape,lv3:ralt_switch
    repeat_rate = 50
    repeat_delay = 300

    follow_mouse = 1
    mouse_refocus = true
    touchpad {
        natural_scroll = yes
        scroll_factor = 1.0
    }

    sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}


# ╻  ┏━┓╻ ╻┏━┓╻ ╻╺┳╸┏━┓
# ┃  ┣━┫┗┳┛┃ ┃┃ ┃ ┃ ┗━┓
# ┗━╸╹ ╹ ╹ ┗━┛┗━┛ ╹ ┗━┛

dwindle {
    preserve_split = yes
    # special_scale_factor = 0.9
}

master {
    new_status = master
}

# ┏┳┓╻┏━┓┏━╸
# ┃┃┃┃┗━┓┃
# ╹ ╹╹┗━┛┗━╸

cursor {
    warp_on_change_workspace = true
}

misc {
    force_default_wallpaper = 0
    focus_on_activate = true
}

opengl {
    nvidia_anti_flicker = 1
}

# ┏━┓┏━┓╻ ╻┏━┓┏━╸┏━╸
# ┗━┓┃ ┃┃ ┃┣┳┛┃  ┣╸
# ┗━┛┗━┛┗━┛╹┗╸┗━╸┗━╸

source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/theme.conf


source=~/.config/hypr/custom/env.conf
source=~/.config/hypr/custom/monitors.conf
source=~/.config/hypr/custom/execs.conf
source=~/.config/hypr/custom/general.conf
source=~/.config/hypr/custom/rules.conf
source=~/.config/hypr/custom/keybinds.conf



# Volume keys
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# Brightness keys
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
