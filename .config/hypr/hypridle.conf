# Idle management — OLED care.
# Not a lock/logout: the session is untouched; input instantly restores it.
# Regular DPMS-off periods also give the OLED's firmware its chance to run
# panel compensation (there is no Linux tool to trigger it explicitly).
#
# Apps playing video (mpv, Firefox) hold Wayland idle-inhibitors, which
# hypridle respects — the screen won't blank mid-lecture.

general {
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim after 2.5 min idle (level is saved and restored on wake)
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle-brightness.sh dim
    on-resume = ~/.config/hypr/scripts/idle-brightness.sh restore
}

# Panel fully off after 5 min idle
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
