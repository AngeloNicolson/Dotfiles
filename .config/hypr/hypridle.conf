# Idle management — OLED care.
# Dim (7 min) locks the session, so the password is needed from then on.
# Panel-off (77 min) and suspend also lock; waking always lands on hyprlock.
# Regular DPMS-off periods also give the OLED's firmware its chance to run
# panel compensation (there is no Linux tool to trigger it explicitly).
#
# Apps playing video (mpv, Firefox) hold Wayland idle-inhibitors, which
# hypridle respects — the screen won't blank mid-lecture.

general {
    # Lock before ANY suspend (power menu, lid, power key, logind) so waking
    # lands on hyprlock instead of the open desktop. pidof guard: the power
    # menu (scripts/lock.sh) may already have started it.
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/dpms.sh on
    ignore_dbus_inhibit = false
}

# Dim after 7 min idle and lock at the same time (brightness level is saved
# and restored on wake). lock_cmd's pidof guard avoids a second hyprlock.
listener {
    timeout = 420
    on-timeout = loginctl lock-session; ~/.config/hypr/scripts/idle-brightness.sh dim
    on-resume = ~/.config/hypr/scripts/idle-brightness.sh restore
}

# Panel fully off after 77 min idle (already locked by the dim listener)
listener {
    timeout = 4620
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume = ~/.config/hypr/scripts/dpms.sh on
}
